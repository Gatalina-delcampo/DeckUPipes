name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build EarClarinet.slnx -c Release

      - name: Test
        run: dotnet test tests/EarClarinet.Tests/EarClarinet.Tests.csproj -c Release --no-build

      - name: Publish single-file (self-contained)
        run: dotnet publish src/EarClarinet.App/EarClarinet.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist/publish

      - name: Smoke test
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\smoke.txt"
          $p = Start-Process -FilePath "dist\publish\EarClarinet.App.exe" -ArgumentList "--smoke-test" -RedirectStandardOutput $out -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke test exited with $($p.ExitCode)" }
          $log = Get-Content $out -Raw
          if ($log -notmatch "CloseButton self-test: PASS") { throw "smoke assertions missing" }
          Write-Output "smoke test OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: earclarinet-win-x64
          path: dist/publish/EarClarinet.App.exe

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: earclarinet-win-x64
          path: dist/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "installer\earclarinet.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: earclarinet-setup
          path: artifacts/EarClarinet-*-setup.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/EarClarinet-*-setup.exe
            dist/publish/EarClarinet.App.exe
