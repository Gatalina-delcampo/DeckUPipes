name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DeckUPipes.slnx -c Release

      - name: Test
        run: dotnet test tests/DeckUPipes.Tests/DeckUPipes.Tests.csproj -c Release --no-build

      - name: Publish single-file (self-contained)
        run: dotnet publish src/DeckUPipes.App/DeckUPipes.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o dist/publish

      - name: Smoke test
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\smoke.txt"
          $p = Start-Process -FilePath "dist\publish\DeckUPipes.App.exe" -ArgumentList "--smoke-test" -RedirectStandardOutput $out -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke test exited with $($p.ExitCode)" }
          $log = Get-Content $out -Raw
          if ($log -notmatch "self-tests: ") { throw "smoke self-tests did not run" }
          if ($log -match "self-test: FAIL") { throw "a smoke self-test failed" }
          Write-Output "smoke test OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deckupipes-win-x64
          path: dist/publish/DeckUPipes.App.exe

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: deckupipes-win-x64
          path: dist/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          $ver = (git describe --tags --abbrev=0) -replace '^v', ''
          & $iscc "/DMyAppVersion=$ver" "installer\deckupipes.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: deckupipes-setup
          path: artifacts/DeckUPipes-*-setup.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DeckUPipes-*-setup.exe
            dist/publish/DeckUPipes.App.exe


